<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Della Curls & Colors | POS</title>
    
    <!-- Tailwind CSS & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: sans-serif; background-color: black; color: white; }
        .tab-hidden { display: none !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    </style>
</head>
<body class="max-w-md mx-auto h-screen flex flex-col relative border-x border-yellow-900/30 overflow-hidden">
    
    <!-- HEADER WITH LOGO -->
    <header class="bg-gradient-to-b from-black to-zinc-900 border-b border-yellow-600/30 p-4 flex flex-col items-center shrink-0 z-10">
        <div class="relative w-20 h-28 mb-2 mt-2">
           <div class="absolute inset-0 rounded-[50%] border-2 border-yellow-500 opacity-50 animate-pulse" style="animation-duration: 3s;"></div>
           <img src="logo.jpg" alt="DELLA Curls and colors Logo" class="w-full h-full rounded-[50%] object-cover border-2 border-[#111] shadow-[0_0_15px_rgba(234,179,8,0.4)] relative z-10">
        </div>
        <h1 class="text-2xl font-serif text-center tracking-wider text-yellow-500 drop-shadow-md" style="font-family: 'Cormorant Garamond', serif;">DELLA</h1>
        <p class="text-[10px] text-center tracking-[0.2em] uppercase text-yellow-200/70 mt-1">Curls and colors</p>
    </header>

    <!-- SUCCESS OVERLAY -->
    <div id="success-overlay" class="absolute inset-0 bg-black/90 z-50 flex flex-col items-center justify-center text-white backdrop-blur-md tab-hidden">
        <i data-lucide="check-circle" class="w-24 h-24 text-yellow-500 mb-4 animate-bounce drop-shadow-[0_0_10px_rgba(234,179,8,0.5)]"></i>
        <h2 class="text-3xl font-serif font-bold text-yellow-500" style="font-family: 'Cormorant Garamond', serif;">Saved!</h2>
        <p class="text-gray-300 mt-2 font-medium tracking-wide">Sent to Master Ledger</p>
    </div>

    <!-- MAIN CONTENT -->
    <main class="flex-1 overflow-y-auto pb-24 custom-scrollbar relative">
        
        <!-- CHECKOUT TAB -->
        <div id="tab-checkout" class="p-5 space-y-6">
            <h2 class="text-xl text-yellow-500 border-b border-yellow-600/30 pb-3 flex items-center gap-3" style="font-family: 'Cormorant Garamond', serif;">
                <i data-lucide="calculator" class="w-6 h-6"></i> New Appointment
            </h2>
            
            <form id="checkout-form" class="space-y-5">
                <div class="space-y-1.5">
                    <label class="block text-xs font-bold uppercase tracking-wider text-yellow-600">Select Client</label>
                    <select id="client-select" class="w-full p-3.5 rounded-xl border border-yellow-600/30 bg-zinc-900 text-white outline-none focus:border-yellow-500" required>
                        <option value="" data-price="0">-- Choose Client --</option>
                    </select>
                </div>

                <div class="space-y-1.5">
                    <label class="block text-xs font-bold uppercase tracking-wider text-yellow-600">Primary Service</label>
                    <select id="service-select" class="w-full p-3.5 rounded-xl border border-yellow-600/30 bg-zinc-900 text-white outline-none focus:border-yellow-500" required>
                        <option value="None" data-price="0">-- Choose Service --</option>
                    </select>
                </div>

                <div class="space-y-1.5">
                    <label class="block text-xs font-bold uppercase tracking-wider text-yellow-600">Formulas & Notes</label>
                    <textarea id="formula-input" class="w-full p-3.5 rounded-xl border border-yellow-600/30 bg-zinc-900 text-white outline-none focus:border-yellow-500 h-28 resize-none placeholder-gray-600" placeholder="e.g., Lightener + 20vol..."></textarea>
                </div>

                <div class="space-y-1.5">
                    <label class="block text-xs font-bold uppercase tracking-wider text-yellow-600">Retail Product (Optional)</label>
                    <select id="retail-select" class="w-full p-3.5 rounded-xl border border-yellow-600/30 bg-zinc-900 text-white outline-none focus:border-yellow-500">
                        <option value="None" data-price="0">-- No Retail Product --</option>
                        <option value="Hydrating Curl Cream" data-price="28">Hydrating Curl Cream - $28.00</option>
                        <option value="Salon Shampoo" data-price="20">Salon Shampoo - $20.00</option>
                        <option value="Styling Gel" data-price="25">Styling Gel - $25.00</option>
                    </select>
                </div>

                <div class="space-y-1.5">
                    <label class="block text-xs font-bold uppercase tracking-wider text-yellow-600">Direct Product Cost $ (Write-Off)</label>
                    <input type="number" id="cost-input" step="0.01" class="w-full p-3.5 rounded-xl border border-yellow-600/30 bg-zinc-900 text-white outline-none focus:border-yellow-500 placeholder-gray-600" placeholder="Cost of color/lightener..." required>
                </div>

                <!-- LIVE RECEIPT -->
                <div class="bg-gradient-to-br from-zinc-800 to-zinc-900 border border-yellow-600/50 p-6 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.5)] mt-8 space-y-3 relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-yellow-500/5 rounded-full blur-3xl -mr-10 -mt-10"></div>
                    <h3 class="text-yellow-500 text-lg border-b border-yellow-600/30 pb-3 mb-4" style="font-family: 'Cormorant Garamond', serif;">Live Calculation</h3>
                    
                    <div class="flex justify-between text-sm font-medium"><span class="text-gray-300">Subtotal:</span><span id="display-subtotal" class="text-white">$0.00</span></div>
                    <div class="flex justify-between text-sm text-gray-400"><span>Sales Tax (8.25% on Retail):</span><span id="display-tax">$0.00</span></div>
                    <div class="flex justify-between text-xl font-bold border-t border-yellow-600/30 pt-4 mt-4"><span class="text-white">Charge Client:</span><span id="display-total" class="text-yellow-500">$0.00</span></div>
                    
                    <div class="flex justify-between text-xs mt-3 bg-black/40 p-2 rounded-lg border border-yellow-900/30"><span class="text-gray-400 uppercase tracking-wider font-bold">Net Profit:</span><span id="display-profit" class="text-green-400 font-bold">$0.00</span></div>
                    <div class="flex justify-between text-xs mt-1 bg-black/40 p-2 rounded-lg border border-red-900/30"><span class="text-red-400 uppercase tracking-wider font-bold">Tax Savings (25%):</span><span id="display-withholding" class="text-red-400 font-bold">-$0.00</span></div>
                    <div class="flex justify-between text-xs mt-1 bg-black/40 p-2 rounded-lg border border-yellow-900/30"><span class="text-white uppercase tracking-wider font-bold">True Take-Home:</span><span id="display-takehome" class="text-white font-bold">$0.00</span></div>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-yellow-600 to-yellow-500 text-black font-bold py-4 rounded-xl shadow-[0_0_15px_rgba(234,179,8,0.4)] mt-8 flex items-center justify-center gap-2 text-lg uppercase tracking-wide">
                    <i data-lucide="plus-circle" class="w-6 h-6"></i> Submit Transaction
                </button>
            </form>
        </div>

        <!-- LEDGER TAB -->
        <div id="tab-ledger" class="p-5 tab-hidden">
            <h2 class="text-xl text-yellow-500 border-b border-yellow-600/30 pb-3 mb-5 flex items-center gap-3" style="font-family: 'Cormorant Garamond', serif;">
                <i data-lucide="list" class="w-6 h-6"></i> Master Ledger
            </h2>
            <div id="ledger-container" class="space-y-5">
                <!-- Transactions render here -->
            </div>
        </div>
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bg-zinc-900 border-t border-yellow-900/50 flex justify-around p-2 pb-6 absolute bottom-0 w-full z-20 shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
        <button id="btn-nav-checkout" class="flex flex-col items-center gap-1.5 w-1/3 py-2 rounded-xl text-yellow-500 bg-yellow-500/10 transition-colors">
            <i data-lucide="calculator" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase tracking-widest">Register</span>
        </button>
        <button id="btn-nav-ledger" class="flex flex-col items-center gap-1.5 w-1/3 py-2 rounded-xl text-gray-500 hover:text-gray-300 transition-colors">
            <i data-lucide="list" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase tracking-widest">Ledger</span>
        </button>
    </nav>

    <!-- APP LOGIC -->
    <script>
        lucide.createIcons();

        // 1. Initial Database Setup
        const clients = ["Jessica T.", "Sarah M.", "Amanda R.", "Emily R.", "Kathy Hanchy", "Lisa Hazel"];
        const services = [
            { name: "Lived-In Balayage", price: 180 },
            { name: "Bespoke Curl Cut", price: 85 },
            { name: "Luxury Blowout", price: 55 },
            { name: "Custom Root Smudge", price: 145 },
            { name: "Full Highlight", price: 75 },
            { name: "Partial Highlight", price: 55 }
        ];
        
        let ledger = [
            { id: "TX-101", date: "Aug 25, 2026", client: "Jessica T.", service: "Lived-In Balayage", retail: "None", formula: "Lightener + 20vol. Gloss: 9N + 9V (15 mins).", cost: 22.50, profit: 157.50, total: 180.00 },
            { id: "TX-102", date: "Sep 20, 2026", client: "Kathy Hanchy", service: "Partial Highlight", retail: "None", formula: "9G next time", cost: 10.00, profit: 45.00, total: 55.00 }
        ];

        // 2. Populate Dropdowns
        const clientSelect = document.getElementById('client-select');
        clients.forEach(c => clientSelect.innerHTML += `<option value="${c}">${c}</option>`);
        
        const serviceSelect = document.getElementById('service-select');
        services.forEach(s => serviceSelect.innerHTML += `<option value="${s.name}" data-price="${s.price}">${s.name} - $${s.price.toFixed(2)}</option>`);

        // 3. Live Calculator Logic
        const retailSelect = document.getElementById('retail-select');
        const costInput = document.getElementById('cost-input');

        function updateMath() {
            let servicePrice = parseFloat(serviceSelect.options[serviceSelect.selectedIndex].getAttribute('data-price')) || 0;
            let retailPrice = parseFloat(retailSelect.options[retailSelect.selectedIndex].getAttribute('data-price')) || 0;
            let cost = parseFloat(costInput.value) || 0;

            let subtotal = servicePrice + retailPrice;
            let tax = (retailPrice > 0) ? (retailPrice * 0.0825) : 0;
            let grandTotal = subtotal + tax;
            
            let netProfit = subtotal - cost;
            let taxSavings = netProfit > 0 ? (netProfit * 0.25) : 0;
            let takeHome = netProfit - taxSavings;

            document.getElementById('display-subtotal').innerText = '$' + subtotal.toFixed(2);
            document.getElementById('display-tax').innerText = '$' + tax.toFixed(2);
            document.getElementById('display-total').innerText = '$' + grandTotal.toFixed(2);
            document.getElementById('display-profit').innerText = '$' + netProfit.toFixed(2);
            document.getElementById('display-withholding').innerText = '-$' + taxSavings.toFixed(2);
            document.getElementById('display-takehome').innerText = '$' + takeHome.toFixed(2);
            
            return { subtotal, tax, grandTotal, netProfit, taxSavings, takeHome, cost };
        }

        serviceSelect.addEventListener('change', updateMath);
        retailSelect.addEventListener('change', updateMath);
        costInput.addEventListener('input', updateMath);

        // 4. Render Ledger List
        const ledgerContainer = document.getElementById('ledger-container');
        function renderLedger() {
            ledgerContainer.innerHTML = '';
            ledger.forEach(tx => {
                let retailHTML = tx.retail !== 'None' ? `<p><span class="font-semibold text-yellow-600/80">Retail:</span> ${tx.retail}</p>` : '';
                ledgerContainer.innerHTML += `
                    <div class="bg-zinc-900 p-5 rounded-2xl shadow-lg border border-yellow-900/30 relative overflow-hidden group">
                        <div class="absolute left-0 top-0 bottom-0 w-1 bg-gradient-to-b from-yellow-500 to-yellow-700"></div>
                        <div class="flex justify-between items-start border-b border-zinc-800 pb-3 mb-3">
                            <div>
                                <h3 class="font-bold text-lg text-white">${tx.client}</h3>
                                <span class="text-xs text-yellow-600 font-medium tracking-wider">${tx.date} | ${tx.id}</span>
                            </div>
                            <div class="text-right">
                                <span class="block font-bold text-xl text-yellow-500">$${tx.total.toFixed(2)}</span>
                                <span class="text-xs text-green-400 bg-green-400/10 border border-green-400/20 px-2.5 py-1 rounded-full inline-block mt-1 font-bold">Net: $${tx.profit.toFixed(2)}</span>
                            </div>
                        </div>
                        <div class="text-sm text-gray-300 space-y-2">
                            <p><span class="font-semibold text-yellow-600/80">Service:</span> ${tx.service}</p>
                            ${retailHTML}
                            <p class="bg-black/50 p-3 rounded-lg italic text-xs mt-3 border border-zinc-800 text-gray-400">"${tx.formula}"</p>
                            <p class="text-[10px] text-gray-500 pt-2 font-mono uppercase tracking-wider">Write-off logged: $${tx.cost.toFixed(2)}</p>
                        </div>
                    </div>
                `;
            });
        }
        renderLedger();

        // 5. Submit Transaction
        document.getElementById('checkout-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const math = updateMath();
            
            const newTx = {
                id: 'TX-' + Math.floor(Math.random() * 1000 + 200),
                date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
                client: clientSelect.value,
                service: serviceSelect.value,
                retail: retailSelect.value,
                formula: document.getElementById('formula-input').value,
                total: math.grandTotal,
                profit: math.netProfit,
                cost: math.cost
            };

            // Add to top of ledger
            ledger.unshift(newTx);
            renderLedger();

            // Show Success Overlay
            const overlay = document.getElementById('success-overlay');
            overlay.classList.remove('tab-hidden');
            
            setTimeout(() => {
                overlay.classList.add('tab-hidden');
                document.getElementById('checkout-form').reset();
                updateMath();
                document.getElementById('btn-nav-ledger').click(); // Auto-switch to ledger
            }, 1500);
        });

        // 6. Navigation Tabs Logic
        const tabCheckout = document.getElementById('tab-checkout');
        const tabLedger = document.getElementById('tab-ledger');
        const btnCheckout = document.getElementById('btn-nav-checkout');
        const btnLedger = document.getElementById('btn-nav-ledger');

        btnCheckout.addEventListener('click', () => {
            tabCheckout.classList.remove('tab-hidden');
            tabLedger.classList.add('tab-hidden');
            btnCheckout.className = "flex flex-col items-center gap-1.5 w-1/3 py-2 rounded-xl text-yellow-500 bg-yellow-500/10 transition-colors";
            btnLedger.className = "flex flex-col items-center gap-1.5 w-1/3 py-2 rounded-xl text-gray-500 hover:text-gray-300 transition-colors";
        });

        btnLedger.addEventListener('click', () => {
            tabLedger.classList.remove('tab-hidden');
            tabCheckout.classList.add('tab-hidden');
            btnLedger.className = "flex flex-col items-center gap-1.5 w-1/3 py-2 rounded-xl text-yellow-500 bg-yellow-500/10 transition-colors";
            btnCheckout.className = "flex flex-col items-center gap-1.5 w-1/3 py-2 rounded-xl text-gray-500 hover:text-gray-300 transition-colors";
        });
    </script>
</body>
</html>
